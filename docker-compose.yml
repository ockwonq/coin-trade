version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: bitget-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme123}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - bitget-network

  # Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bitget-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:${MONGO_ROOT_PASSWORD:-changeme123}@mongodb:27017/bitget-trading?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this}
      JWT_EXPIRE: 7d
      BITGET_API_KEY: ${BITGET_API_KEY}
      BITGET_SECRET_KEY: ${BITGET_SECRET_KEY}
      BITGET_PASSPHRASE: ${BITGET_PASSPHRASE}
      BITGET_API_URL: https://api.bitget.com
      BITGET_WS_URL: wss://ws.bitget.com/mix/v1/stream
      CORS_ORIGIN: http://localhost
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - bitget-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bitget-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - bitget-network

networks:
  bitget-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
